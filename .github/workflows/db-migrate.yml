name: Production DB Migration

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
  workflow_dispatch:

jobs:
  migrate-production:
    name: Apply Migrations to Production
    runs-on: ubuntu-latest
    environment: production # Requires manual approval in GitHub Environment settings
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Check required secrets
        run: |
          if [ -z "${{ secrets.PROD_SUPABASE_PROJECT_REF }}" ] || [ -z "${{ secrets.PROD_SUPABASE_DB_PASSWORD }}" ]; then
            echo "::warning ::Production Supabase secrets (PROD_SUPABASE_PROJECT_REF or PROD_SUPABASE_DB_PASSWORD) are not yet configured. Skipping migration until production project is linked."
            exit 0
          fi

      - name: Link Production Project
        if: env.PROD_SUPABASE_PROJECT_REF != ''
        run: |
          supabase link --project-ref ${{ secrets.PROD_SUPABASE_PROJECT_REF }} --password "${{ secrets.PROD_SUPABASE_DB_PASSWORD }}"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.PROD_SUPABASE_ACCESS_TOKEN }}

      - name: Push Migrations to Production
        if: env.PROD_SUPABASE_PROJECT_REF != ''
        run: |
          supabase db push --password "${{ secrets.PROD_SUPABASE_DB_PASSWORD }}"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.PROD_SUPABASE_ACCESS_TOKEN }}
